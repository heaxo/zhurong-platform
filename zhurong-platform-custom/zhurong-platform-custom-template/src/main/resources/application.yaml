server:
  port: 9300
  # 客户端 custom 仅供本机透明代理调用，不直接暴露给局域网。
  address: 127.0.0.1

spring:
  profiles:
    active: dev
  application:
    name: zhurong-platform-custom
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin
    virtual-host: /

    listener:
      simple:
        acknowledge-mode: auto
        # Lantek/Expert 自动化通常不支持并发，模板默认串行消费。
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_custom_history
    schemas: flyway_schema_custom
    default-schema: flyway_schema_custom
  datasource:
    dynamic:
      primary: lantek
      strict: false
      datasource:
        lantek: # SQL Server（主库）
          url: jdbc:sqlserver://localhost:1433;databaseName=LSystemDB;encrypt=false
          username: sa
          password:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: localhost:8848
        # 客户端要发现 core/auth，但不能注册成 Gateway 可访问的服务。
        register-enabled: false
      config:
        server-addr: localhost:8848
        file-extension: yaml
        group: DEFAULT_GROUP
  config:
    import:
      - nacos:zhurong-platform-custom
      - nacos:zhurong-platform-custom-template-${spring.profiles.active}
      - nacos:zhurong-platform-security-${spring.profiles.active}


mybatis-plus:
  mapper-locations:
    - classpath:/mapper/**/*.xml
    - classpath*:/mapper-common/**/*.xml
  type-aliases-package: com.zhurong.platform.custom.entity
  configuration:
    map-underscore-to-camel-case: false

zhurong:
  client-communication:
    # 客户端部署模板：用 Windows 主机名声明专属 MQ 队列。
    enabled: true
    client-id-from-hostname: true
    client-id:
    user-name:
    version: 1.0.0
    heartbeat-seconds: 30
    # core 透明代理命令在客户端上调用的本机 custom HTTP 地址。
    local-base-url: http://127.0.0.1:${server.port}
    proxy-connect-timeout-seconds: 10
    proxy-max-response-bytes: 52428800
