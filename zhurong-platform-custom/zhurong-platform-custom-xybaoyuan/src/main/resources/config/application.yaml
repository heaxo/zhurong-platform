  jwt:
    secret: OzexezyRNxbKFxQcjD5cqJTKSCb7gisPrvbfyF/OpeCOO8iBFN8t0CXauArYEqYfe4h1qTexs+1F+qXXvsFOZA==

zhurong:
  client-communication:
    # 本模块只部署到 Windows 客户端，启动后直接注册本机专属 MQ 队列。
    enabled: true
    client-id-from-hostname: true
    client-id:
    user-name:
    version: 1.0.0
    heartbeat-seconds: 30
    local-base-url: http://127.0.0.1:${server.port}
    proxy-connect-timeout-seconds: 10
    proxy-max-response-bytes: 52428800
