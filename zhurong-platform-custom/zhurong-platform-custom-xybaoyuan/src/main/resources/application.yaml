server:
  port: 9300
  # xybaoyuan 只在 Windows 客户端本机提供给反向代理访问，不直接暴露到局域网。
  address: 127.0.0.1

spring:
  profiles:
    active: dev
  application:
    name: zhurong-platform-custom
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin
    virtual-host: /

    listener:
      simple:
        acknowledge-mode: auto
        # 本机 Lantek 自动化程序不支持并发执行，客户端命令必须串行消费。
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_custom_history
    schemas: flyway_schema_custom
    default-schema: flyway_schema_custom
  datasource:
    dynamic:
      primary: lantek
      strict: false
      datasource:
        lantek: # SQL Server（主库）
          url: jdbc:sqlserver://localhost:1433;databaseName=LSystemDB;encrypt=false
          username: sa
          password:
          driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: 192.168.1.125:8848
        # 客户端需要发现 core/auth，但不能注册成可被 Gateway 负载均衡的 HTTP 服务。
        register-enabled: false
      config:
        server-addr: 192.168.1.125:8848
        file-extension: yaml
        group: DEFAULT_GROUP
  config:
    import:
      - nacos:zhurong-platform-custom
      - nacos:zhurong-platform-custom-xybaoyuan-${spring.profiles.active}
      - nacos:zhurong-platform-security-${spring.profiles.active}


mybatis-plus:
  mapper-locations:
    - classpath:/mapper/**/*.xml
    - classpath*:/mapper-common/**/*.xml
  type-aliases-package: com.zhurong.platform.custom.entity
  configuration:
    map-underscore-to-camel-case: false

xybaoyuan:
  inbound:
    # 金蝶下发基础零件后，按日期生成/追加“零件基础信息yyyy-MM-dd.xlsx”的目录；该目录必须预先存在
    base-part-excel-directory: 'D:\Zhurong'
    # DXF图纸共享目录，用于拼接Excel中的“图纸路径”
    drawing-root: '\\192.168.2.57\图纸库\'
    # DXF图纸文件后缀，用于拼接Excel中的“图纸路径”
    drawing-extension: '.dxf'
  lantek:
    install: C:\Lantek
  erp:
    steel-plate-url: http://223.105.87.10:8089/k3cloud/Kingdee.K3Cloud.GRMM.WebApi.ServicesStub.LantekLinkService.QueryStock.common.kdsvc
    secret-key: grmm12345678
  feedback:
    url: http://222.187.33.220:60088/k3cloud/Kingdee.K3Cloud.GRMM.WebApi.ServicesStub.LantekLinkService.NstResultSave.common.kdsvc
    withdraw-url: http://222.187.33.220:60088/k3cloud/Kingdee.K3Cloud.GRMM.WebApi.ServicesStub.LantekLinkService.NstResultDel.common.kdsvc
    secret-key: grmm12345678
    ftp:
      host: 127.0.0.1
      port: 21
      username: TEST
      password: 123
      cnc-virtual-root: CNC
      pdf-virtual-root: Nestings

zhurong:
  client-communication:
    # 本模块只部署到 Windows 客户端，启动后直接注册本机专属 MQ 队列。
    enabled: true
    client-id-from-hostname: true
    client-id:
    user-name:
    version: 1.0.0
    heartbeat-seconds: 30
    local-base-url: http://127.0.0.1:${server.port}
    proxy-connect-timeout-seconds: 10
    proxy-max-response-bytes: 52428800
